# ============================================================================
# Alembic — DB 마이그레이션
# ============================================================================
# DB URL 은 런타임에 BLOGITEM_DB_PATH 환경변수로 주입됨 (env.py).
# 이 파일은 logging 설정 + script_location 만 담당.
# ----------------------------------------------------------------------------

[alembic]
script_location = migrations
prepend_sys_path = src
timezone = Asia/Seoul
revision_environment = false
sourceless = false
version_path_separator = os
output_encoding = utf-8

# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
