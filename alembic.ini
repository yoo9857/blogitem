# ============================================================================
# Alembic - DB migrations
# ============================================================================
# NOTE: This file is read with locale encoding by Alembic on Windows
# (cp949 on Korean locale). Keep ASCII-only to avoid UnicodeDecodeError.
#
# DB URL is injected at runtime via BLOGITEM_DB_PATH env var (see env.py).
# This file controls logging config + script_location only.
# ----------------------------------------------------------------------------

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
timezone = Asia/Seoul
revision_environment = false
sourceless = false
version_path_separator = os
output_encoding = utf-8

# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
