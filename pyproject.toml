[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blogitem"
version = "0.1.0"
description = "AI 멀티-스텝 콘텐츠 파이프라인 — 네이버 블로그 자동 게시 데스크톱 앱"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "오한빈", email = "ohhanbin0506@gmail.com" }]
keywords = ["pipeline", "anthropic", "naver", "blog", "desktop"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Office/Business",
    "Private :: Do Not Upload",
]
dependencies = [
    # GUI
    "PySide6>=6.7,<7.0",
    # AI
    "anthropic>=0.40,<1.0",
    # HTTP
    "httpx>=0.27,<1.0",
    # DB / migrations
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    # 설정 / 검증
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    # 시크릿
    "keyring>=25.0,<26.0",
    # 로깅
    "structlog>=24.0,<26.0",
    # 비밀번호 해시 (어드민 옵션)
    "argon2-cffi>=23.0,<24.0",
    # 알림 (cross-platform desktop notifications)
    "plyer>=2.1,<3.0",
    # 환경 로딩
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-qt>=4.4,<5.0",
    "pytest-mock>=3.14,<4.0",
    "respx>=0.21,<1.0",                # httpx mock
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "types-requests",
]
build = [
    "pyinstaller>=6.6,<7.0",
]

[project.scripts]
blogitem = "blogitem.__main__:main"

[project.urls]
Repository = "https://github.com/yoo9857/blogitem"

[tool.hatch.build.targets.wheel]
packages = ["src/blogitem"]

[tool.hatch.build.targets.sdist]
include = ["src/blogitem", "migrations", "README.md", "pyproject.toml"]
